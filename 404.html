<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · PROVIDETECH</title>
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<script>
  // Web addresses are case-sensitive: send /ADMIN, /Checkout, /Hub etc. to the lowercase page.
  (function () {
    var p = location.pathname, low = p.toLowerCase();
    if (low !== p) location.replace(low + location.search + location.hash);
  })();
</script>
<style>
  :root{--bg:#F6F9FC;--ink:#0B1623;--ink-2:#4A5A6E;--blue:#0096FF;--btn:#0B6BCB}
  @media (prefers-color-scheme:dark){:root{--bg:#0B1220;--ink:#EAF2FB;--ink-2:#A9B8CA;--btn:#2E8BE6}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  img{height:52px;width:auto;margin-bottom:18px}
  h1{font-size:1.6rem;margin:0 0 8px;letter-spacing:-.02em}
  p{margin:0 0 22px;color:var(--ink-2)}
  a.btn{display:inline-block;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
</style>
</head>
<body>
  <main>
    <img src="/assets/logo-mark.png" alt="">
    <h1>Page not found</h1>
    <p>This page doesn't exist. Check the address, or go back to the homepage.</p>
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
